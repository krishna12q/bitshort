<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitshort | Shorten</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <link rel="icon" type="image/png" href="/static/Bitshort_Logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .h {
            font-size: clamp(38px, 7vw, 64px);
            font-weight: 900;
            letter-spacing: -3px;
            text-align: center;
            margin: 0 0 18px;
        }

        p {
            color: #888;
            font-size: 15px;
            line-height: 1.7;
            text-align: center;
            max-width: 420px;
            margin: 0 0 30px;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 16px;
            background: #111;
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            border-color: #fff;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 1px solid #fff;
            border-radius: 5px;
            background: #fff;
            color: #080808;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: transparent;
            color: #fff;
        }

        .note {
            margin-top: 35px;
            padding-top: 22px;
            border-top: 1px solid #292929;
        }

        .note h2 {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 10px;
        }

        .note p {
            font-size: 13px;
            color: #777;
            text-align: left;
            margin: 0;
        }
    </style>
</head>

<body>

    <h1 class="h">Shorten.</h1>

    <p>Paste your URL below and create a shorter link. Make sure the URL is valid before submitting.</p>

    <div class="form-container">

        <form method="post" action="/backend_shorten">
            <input
                name="link"
                type="text"
                placeholder="github.com/krishna12q"
                required
            >
            <button type="submit">Shorten</button>
        </form>

    </div>

</body>
</html>
